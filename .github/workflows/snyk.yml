name: Snyk Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 0' # Weekly scan at 3 AM on Sunday

jobs:
  snyk:
    name: Snyk Vulnerability Scanner
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip Snyk when token is unavailable
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is not available for this run; skipping Snyk scan."

      - name: Setup Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@master

      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high
