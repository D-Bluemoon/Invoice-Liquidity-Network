name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/docs/**'
      - '.github/workflows/docs-deploy.yml'

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Documentation Toolchain Dependencies
        run: |
          if [ -f "packages/docs/package.json" ]; then
            npm ci --prefix packages/docs
          else
            npm ci
          fi

      - name: Audit Content Inventory and Consolidate Build Directories
        run: |
          echo "🔍 Auditing content completeness across inventory tracks..."
          mkdir -p packages/docs/content/root-migrated
          
          # Copy remaining root docs into the canonical workspace target area to fix deployment gaps
          if [ -d "docs" ] && [ "$(ls -A docs)" ]; then
            echo "📦 Migrating legacy root docs contents into canonical build stream..."
            cp -R docs/* packages/docs/content/root-migrated/
          fi

      - name: Build Comprehensive Documentation Site
        run: |
          if [ -f "packages/docs/package.json" ]; then
            npm run build --prefix packages/docs
          else
            npm run build
          fi

      - name: Verify Completeness of Output Inventory Artifacts
        run: |
          echo "📊 Verifying final build asset distribution footprint..."
          if [ ! -d "packages/docs/dist" ] && [ ! -d "packages/docs/.vuepress/dist" ] && [ ! -d "packages/docs/build" ]; then
            echo "❌ Error: Build output directory not detected. Pipeline incomplete."
            exit 1
          fi
          echo "✅ Audit Complete: Unified documentation site generated successfully!"
