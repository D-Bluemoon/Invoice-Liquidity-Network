name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: namespace-profile-nursca
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
        with:
          install-args: --frozen-lockfile --ignore-scripts
      - name: Lint PR title
        run: |
          echo "${{ github.event.pull_request.title }}" > pr_title
          pnpm exec commitlint --config commitlint.config.js --edit pr_title
