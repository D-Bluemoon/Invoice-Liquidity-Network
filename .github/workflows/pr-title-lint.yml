name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"
      - name: Lint PR title
        run: |
          echo "${{ github.event.pull_request.title }}" > pr_title
          pnpm dlx -p @commitlint/cli@17.8.1 -p @commitlint/config-conventional@17.8.1 commitlint --config commitlint.config.js --edit pr_title
