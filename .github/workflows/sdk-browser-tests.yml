name: SDK Browser Tests

on:
  push:
    paths:
      - 'packages/sdk/**'
  pull_request:
    paths:
      - 'packages/sdk/**'

jobs:
  browser-tests:
    runs-on: namespace-profile-nursca
    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundle
        run: npm run build:browser

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/sdk/package-lock.json', 'packages/sdk/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser compatibility tests
        run: npm run test:browser
