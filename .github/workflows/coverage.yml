name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: namespace-profile-nursca
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.gitmodules'

  coverage:
    name: Run tests and collect coverage
    needs: changes
    runs-on: namespace-profile-nursca
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm with store cache
        uses: ./.github/actions/setup-pnpm
          
      - name: Setup Rust
        if: needs.changes.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          
      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.backend == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov
          
      - name: Run Rust Coverage
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 80 --lcov --output-path ../rust-lcov.info
        
      - name: Run notification template coverage
        working-directory: notifications
        run: >
          pnpm exec vitest run tests/templates.test.ts
          --coverage
          --coverage.include=src/templates/funded.template.ts
          --coverage.include=src/templates/payment.template.ts
          --coverage.include=src/templates/dispute.template.ts
          --coverage.include=src/templates/due-warning.template.ts
          --coverage.include=src/templates/helpers.ts
          --coverage.thresholds.lines=80
          --coverage.thresholds.functions=80
          --coverage.thresholds.branches=80
          --coverage.thresholds.statements=80
        
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: rust-lcov.info,notifications/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Nursca/Invoice-Liquidity-Network
