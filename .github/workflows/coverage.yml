name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.gitmodules'

  coverage:
    name: Run tests and collect coverage
    needs: changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
          
      - name: Run Rust Coverage
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 80 --lcov --output-path ../rust-lcov.info
        
      - name: Install SDK Dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile
        
      - name: Run SDK Coverage
        working-directory: sdk
        run: npm run test:coverage -- --coverage.thresholds.lines=80

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Coverage
        working-directory: frontend
        run: npm run test -- --coverage --coverage.thresholds.lines=80

      - name: Install Notifications Dependencies
        working-directory: notifications
        run: pnpm install --frozen-lockfile

      - name: Run Notifications Coverage
        working-directory: notifications
        run: npm run test -- --coverage --coverage.thresholds.lines=80
        
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: rust-lcov.info,sdk/coverage/lcov.info,frontend/coverage/lcov.info,notifications/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Nursca/Invoice-Liquidity-Network
