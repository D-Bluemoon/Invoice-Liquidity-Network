name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 0' # Weekly scan at 2 AM on Sunday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-ts:
    name: Analyze (${{ matrix.language }})
    runs-on: namespace-profile-nursca
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths:
            - sdk
            - cli
            - indexer
            - notifications
            - frontend
            - docs
            - packages
            - examples
            - scripts
            - workers
            - contract-deployer
            - account-seeder
            - tests
          paths-ignore:
            - backend
            - "**/*.md"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/coverage/**"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  analyze-rust:
    name: Analyze (rust)
    runs-on: namespace-profile-nursca
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: rust
        config: |
          paths:
            - backend

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:rust"
